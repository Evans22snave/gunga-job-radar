name: Gunga Job Radar

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose what the Job Radar should run"
        required: true
        default: "scan"
        type: choice
        options:
          - scan
          - digest
          - both

  schedule:
    # Scan for new jobs every 6 hours (03:00 / 09:00 / 15:00 /
    # 21:00 EAT — Kenya is UTC+3). GitHub may delay scheduled
    # runs by a few minutes during high platform load; that's
    # normal and not a sign anything is broken.
    - cron: "0 */6 * * *"

    # Daily Gmail digest at ~07:00 EAT
    - cron: "0 4 * * *"

jobs:
  job-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Determine run mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 4 * * *" ]; then
            echo "mode=digest" >> "$GITHUB_OUTPUT"
          else
            echo "mode=scan" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gunga Job Radar
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          echo "Running Gunga Job Radar in ${{ steps.mode.outputs.mode }} mode (triggered by ${{ github.event_name }})..."
          python job_radar.py --mode "${{ steps.mode.outputs.mode }}"
